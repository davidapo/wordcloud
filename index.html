<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassCloud - Live Word Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.0.6/wordcloud2.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 m-0 p-0">

    <!-- מסך מרצה (מוצג מיד כברירת מחדל) -->
    <div id="presenter-view" class="min-h-screen flex flex-col">
        <header class="bg-white border-b border-slate-200 p-4 flex justify-between items-center shadow-sm">
            <h1 class="text-2xl font-black text-indigo-600"><i class="fa-solid fa-cloud"></i> ClassCloud</h1>
            <div class="flex gap-3">
                <button onclick="openQR()" class="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-4 py-2 rounded-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-qrcode"></i> הצג QR לסטודנטים
                </button>
                <button onclick="clearCloud()" class="bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded-lg font-bold">
                    איפוס מסך
                </button>
            </div>
        </header>

        <main class="flex-1 p-6 flex flex-col">
            <input type="text" value="הקלד/י כאן את השאלה לסטודנטים..." class="text-3xl font-bold bg-transparent border-none outline-none text-center mb-6 w-full text-slate-800">
            <div class="bg-white flex-1 rounded-2xl shadow-sm border border-slate-200 relative flex items-center justify-center p-4">
                <div id="empty-state" class="absolute text-slate-400 text-center animate-fade-in">
                    <i class="fa-solid fa-cloud-arrow-up text-6xl mb-4 text-slate-200"></i>
                    <h3 class="text-xl font-bold">המסך מחכה לתשובות...</h3>
                </div>
                <div id="canvas-container" class="w-full h-[60vh] min-h-[400px]">
                    <canvas id="cloud-canvas" class="w-full h-full"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- מסך סטודנט (מוסתר כברירת מחדל) -->
    <div id="student-view" class="hidden min-h-screen items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm text-center border border-slate-200">
            <div class="text-indigo-600 text-4xl mb-4"><i class="fa-solid fa-paper-plane"></i></div>
            <h2 class="text-2xl font-bold mb-2">ClassCloud</h2>
            <p class="text-slate-500 mb-6">הקלידו מילה אחת או שתיים ולחצו על שליחה</p>
            
            <form onsubmit="submitWord(event)">
                <input type="text" id="word-input" maxlength="30" placeholder="התשובה שלך..." required
                    class="w-full text-center text-xl px-4 py-3 border-2 border-slate-200 rounded-xl focus:border-indigo-500 outline-none mb-4 transition">
                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition text-lg">
                    שלח/י למסך
                </button>
            </form>
            
            <div id="success-msg" class="hidden mt-4 p-3 bg-green-100 text-green-700 rounded-lg font-medium">
                התשובה התקבלה בהצלחה!
            </div>
        </div>
    </div>

    <!-- חלון QR קופץ -->
    <div id="qr-modal" class="hidden fixed inset-0 z-50 items-center justify-center p-4" style="background: rgba(0,0,0,0.6);">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full text-center relative">
            <button onclick="closeQR()" class="absolute top-4 left-4 text-slate-400 hover:text-slate-700 text-2xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 class="text-2xl font-bold mb-2">הצטרפות לשיעור</h2>
            <p class="text-slate-500 mb-6">סרקו את הקוד או היכנסו לקישור</p>
            <img id="qr-image" src="" alt="QR Code" class="mx-auto w-56 h-56 mb-6 border p-2 rounded-xl">
            <div class="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200">
                <input type="text" id="share-link" readonly class="bg-transparent text-sm p-2 flex-1 outline-none text-slate-600 dir-ltr text-left" dir="ltr">
                <button onclick="copyLink()" class="bg-indigo-600 text-white px-4 py-2 rounded-md font-bold text-sm hover:bg-indigo-700">העתק</button>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://wordcloud-f2e69-default-rtdb.europe-west1.firebasedatabase.app/words.json";
        const STOP_WORDS = new Set(['את','של','על','עם','כל','גם','או','זה','זו','אלה','אלו','מה','מי','איך','כמה','למה','שוב','עוד','רק','עד','כי','אם']);
        
        let wordsData = {};
        let lastDataString = ""; 

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('role') === 'student') {
                document.getElementById('presenter-view').classList.add('hidden');
                document.getElementById('student-view').classList.remove('hidden');
                document.getElementById('student-view').classList.add('flex');
            } else {
                setInterval(fetchWords, 3000); 
                window.addEventListener('resize', () => {
                    if(Object.keys(wordsData).length > 0) drawCloud();
                });
            }
        };

        function submitWord(e) {
            e.preventDefault();
            const input = document.getElementById('word-input');
            const btn = document.getElementById('submit-btn');
            const word = input.value.trim();
            if (!word) return;

            btn.disabled = true;
            btn.innerText = 'שולח...';

            fetch(FIREBASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ word: word })
            }).then(() => {
                input.value = '';
                document.getElementById('success-msg').classList.remove('hidden');
                setTimeout(() => { document.getElementById('success-msg').classList.add('hidden'); }, 2000);
            }).finally(() => {
                btn.disabled = false;
                btn.innerText = 'שלח/י למסך';
            });
        }

        function fetchWords() {
            fetch(FIREBASE_URL).then(res => res.json()).then(data => {
                let tempWordsData = {};
                if (data) {
                    Object.values(data).forEach(item => {
                        if (item && item.word) {
                            let w = item.word.trim();
                            if (w && !STOP_WORDS.has(w)) tempWordsData[w] = (tempWordsData[w] || 0) + 1;
                        }
                    });
                }
                
                const newDataString = JSON.stringify(tempWordsData);
                
                if (newDataString !== lastDataString) {
                    wordsData = tempWordsData;
                    lastDataString = newDataString;
                    drawCloud();
                }
            }).catch(e => console.log(e));
        }

        function drawCloud() {
            const list = Object.entries(wordsData).map(([text, weight]) => [text, weight]);
            const emptyState = document.getElementById('empty-state');
            const canvas = document.getElementById('cloud-canvas');
            const container = document.getElementById('canvas-container');

            if (list.length === 0) {
                emptyState.style.display = 'block';
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            emptyState.style.display = 'none';
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            if (typeof WordCloud !== 'undefined') {
                WordCloud(canvas, {
                    list: list,
                    fontFamily: 'system-ui, -apple-system, sans-serif',
                    // weightFactor מותאם ומרווח: מקטין קלות את הגודל הכללי כדי להשאיר שטח נשימה
                    weightFactor: function (size) { 
                        return size * (canvas.width / 50); 
                    },
                    // gridSize מוגדל ל-24: מרווח ביטחון נדיב וברור בין המילים
                    gridSize: 24, 
                    color: 'random-dark',
                    rotateRatio: 0, // המילים יופיעו אופקית בלבד לקריאה מהירה ונוחה
                    backgroundColor: 'transparent',
                    drawOutOfBound: false, // מונע ממילים לצאת מגבולות המסך
                    elliptical: true       // יוצר צורה מעוגלת וטבעית יותר לענן
                });
            }
        }

        function clearCloud() {
            if(confirm('לאפס את המסך ולמחוק את כל התשובות?')) {
                fetch(FIREBASE_URL, { method: 'DELETE' }).then(() => { 
                    wordsData = {}; 
                    lastDataString = "{}"; 
                    drawCloud(); 
                });
            }
        }

        function openQR() {
            const studentUrl = window.location.href.split('?')[0] + "?role=student";
            document.getElementById('share-link').value = studentUrl;
            document.getElementById('qr-image').src = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(studentUrl);
            document.getElementById('qr-modal').classList.remove('hidden');
            document.getElementById('qr-modal').classList.add('flex');
        }

        function closeQR() {
            document.getElementById('qr-modal').classList.add('hidden');
            document.getElementById('qr-modal').classList.remove('flex');
        }

        function copyLink() {
            const input = document.getElementById('share-link');
            input.select();
            document.execCommand('copy');
            alert('הקישור הועתק בהצלחה ללוח');
        }
    </script>
</body>
</html>
